<title>Manti · Launch dashboard</title>
<style>
:root{color-scheme:dark;--surface:#222225;--line:#3b3b40;--text:#f5f2e9;--muted:#aebbb9;--green:#cbfa8d;--amber:#ffaf85}*{box-sizing:border-box}body{margin:0;background:#141416;color:var(--text);font:15px/1.5 Arial,sans-serif}main{width:min(1336px,calc(100% - 96px));margin:0 auto;padding:41px 0 65px}header{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 27px;gap:24px}header h1{margin:0;font-size:clamp(30px,4vw,62px);font-weight:700;letter-spacing:-.048em;line-height:1.03}header p{margin:0 0 11px;color:var(--green);font:700 12px monospace;letter-spacing:.12em;text-transform:uppercase}header .right{text-align:right}header .right strong{font-size:23px;letter-spacing:-.02em}h2,h3,p{margin:0}h2{font-size:23px;letter-spacing:-.02em}h3{font-size:17px}.muted,small{color:var(--muted)}.mono{font:12px monospace;letter-spacing:.035em}button,select{font:inherit}button{color:inherit;background:#303034;border:1px solid #52625d;border-radius:5px;padding:8px 13px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--green);outline:none}button:disabled{opacity:.55;cursor:default}.action{background:var(--green);color:#152114;font-weight:700;border-color:var(--green)}a{color:var(--green)}.strip{display:flex;gap:20px;align-items:center;justify-content:space-between;border:1px solid #42564a;border-left:3px solid var(--green);padding:12px 16px;background:#303034;margin-bottom:18px}.strip b{color:var(--green);margin-right:10px}.summary{display:grid;grid-template-columns:.8fr 1.1fr 1.1fr;gap:14px;margin-bottom:20px}.sheet,.metric{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:0}.metric{padding:17px 20px}.metric .label{color:var(--muted);text-transform:uppercase;font:700 11px monospace;letter-spacing:.08em}.number{font-size:36px;font-weight:700;letter-spacing:-.05em;margin:5px 0}.bar{margin:12px 0 9px;height:5px;background:#354443;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.prob{color:var(--amber)}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}.sheet{padding:20px;margin-bottom:17px}.sheethead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}.risk{width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 0;border-radius:0;display:grid;grid-template-columns:1fr auto;gap:12px;text-align:left}.risk:hover{background:#303034}.risk:last-child{padding-bottom:1px}.risk span{display:block}.risk b.gap{font-size:22px;color:var(--amber);display:block;text-align:right;line-height:1.1}.risk-detail{margin:9px 0 0;font-size:13px;color:var(--muted);max-width:600px}.activity{border-top:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:1fr auto;gap:4px}.activity small{white-space:nowrap}.activity p{grid-column:1/-1;color:var(--muted);font-size:13px}.option-wrap,.thread-wrap{display:grid;gap:12px}.option-wrap select,.thread-wrap select{width:100%;border:1px solid var(--line);padding:8px;border-radius:4px;background:#263536;color:var(--text);min-width:0}.price{font-size:32px;font-weight:700;letter-spacing:-.05em;color:var(--green)}.note{color:var(--muted);font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.messages{border-left:2px solid var(--line);padding-left:12px}.messages article{margin:0 0 12px}.messages p{white-space:pre-wrap;font-size:14px;margin-top:5px}.msg-status{color:var(--amber);font-weight:bold}.toast{color:var(--amber);margin:7px 0}.toast:empty{display:none}dialog{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;width:min(740px,90vw);max-height:80vh;overflow:auto}dialog::backdrop{background:#080d10bb}dialog button{float:right}dialog li{margin:10px 0;overflow-wrap:anywhere}textarea{width:100%;min-height:76px;background:#263536;color:var(--text);font:inherit;padding:8px;border:1px solid var(--line)}@media(max-width:800px){main{width:calc(100% - 36px);padding-top:22px}.grid,.summary{grid-template-columns:1fr}.strip{align-items:start}header{align-items:start}.number{font-size:32px}}

:root{--surface:#222225;--line:#383d42;--muted:#b3babe;--green:#b5c9bd;--amber:#e4ba91}body{display:grid;grid-template-columns:180px minmax(0,1fr);background:#141416;font-family:system-ui,sans-serif}
.rail{position:sticky;top:0;height:100vh;background:#1a1a1d;border-right:1px solid var(--line);padding:24px 14px}.rail .brand{display:flex;align-items:center;gap:6px;font-size:21px}.rail svg{width:34px;height:34px}.dough,.knot{fill:#737cda}.pleat{fill:none;stroke:#ffffff88;stroke-width:1.3}.knot{stroke:#1a1a1d}.rail nav{display:grid;gap:6px;margin-top:40px}.rail a{padding:9px 11px;color:var(--muted);text-decoration:none;border-radius:7px}.rail a[aria-current]{background:#303a36;color:var(--text)}main{width:100%;padding:25px clamp(16px,3vw,45px) 48px}header{align-items:center}header h1{font-size:clamp(28px,3vw,42px)}.sheet,.metric,.strip{border-radius:13px}.metric:first-child{background:linear-gradient(115deg,#293139,#454858)}.metric.short{background:linear-gradient(115deg,#33292b,var(--surface));--green:#eda39e}.metric.complete{background:linear-gradient(115deg,#303033,var(--surface));--green:#a0d3b0}.metric .number{color:var(--green)}.grid[hidden],[hidden]{display:none!important}.option-wrap{max-height:620px;overflow-y:auto}
@media(max-width:800px){body{display:block}.rail{height:auto;position:static;display:flex;justify-content:space-between;align-items:center;padding:6px 12px}.rail nav{display:flex;margin:0}.summary{grid-template-columns:1fr 1fr}.metric:first-child{grid-column:1/-1}main{width:100%;padding:16px}.number{font-size:27px}.grid{grid-template-columns:1fr}}
.rail .brand img{display:block;width:min(128px,100%);height:auto}
#approval-preview { white-space: pre-wrap; overflow-wrap: anywhere; }
#approval-status, #approval-preview { margin: 12px 0; }
#approval-dialog .actions button { float: none; }

</head>
<body><aside class="rail"><div class="brand"><img src="/brand/manti-logo.png" width="128" height="22" alt="Manti"></div><nav aria-label="Workspace"><a href="#dashboard">Dashboard</a><a href="#activity">Activity Log</a></nav></aside><main>
<header><div><p>Soony · Procurement</p><h1 id="page-name">Dashboard</h1></div><div class="right"><strong id="launch">Grand Heist 6</strong><div class="muted mono" id="site">DC-HAM</div></div><form id="account" hidden method="post" action="/logout"><span id="username"></span> <button type="submit">Sign out</button></form></header>
<div class="strip"><span id="sync-status" role="status">Building launch snapshot…</span><button id="sync" data-write="ready">Refresh inputs</button></div>
<p id="data-health" class="muted mono" style="width:fit-content;margin:0 0 12px;padding:4px 8px;border:1px solid var(--line);border-radius:4px" hidden></p>
<details id="source-reviews" class="sheet" hidden><summary id="review-summary"></summary><ul id="review-list"></ul></details>
<p id="feedback" class="toast" role="status"></p>
<section class="summary" aria-label="Launch readiness" id="summary"></section>
<div class="grid" id="dashboard-panels">
<div><section class="sheet"><div class="sheethead"><h2>Component risks</h2><small>Open any row for evidence</small></div><div id="risks"></div></section>
<section class="sheet"><div class="sheethead"><h2>Supplier threads</h2></div><div class="thread-wrap" id="threads"></div></section></div>
<div><section class="sheet"><div class="sheethead"><h2>Approval inbox</h2><small>Procurement</small></div><div class="option-wrap" id="options"></div></section>
<section class="sheet"><div class="sheethead"><h2>Agent activity</h2></div><div id="activity"></div></section></div>
</div>
<section id="history-panels" class="sheet" hidden><div class="sheethead"><h2>Decision history</h2></div><div id="past-decisions"></div></section>
<dialog id="sources" aria-labelledby="source-title"><button id="close-sources" type="button">Close</button><h2 id="source-title">Evidence</h2><ul id="source-list"></ul></dialog>
<dialog id="approval-dialog" aria-labelledby="approval-title">
<h2 id="approval-title">Review next step</h2>
<p id="approval-preview"></p>
<p id="approval-status" role="status"></p>
<div class="actions"><button id="cancel-approval" type="button" autofocus>Cancel</button><button id="submit-approval" class="action" type="button" disabled>Approve</button></div>
</dialog>
</main>
<script>
const number = new Intl.NumberFormat("en-GB");
const date = new Intl.DateTimeFormat("en-GB", {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Berlin"});
const euro = new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const $ = id => document.getElementById(id);
const node = (tag,value,className) => {
  const element = document.createElement(tag);
  if (value !== undefined) element.textContent = value;
  if (className) element.className = className;
  return element;
};
let state, optionId, threadId, lastState, lastDrop, approving;
let busy = false, refreshNumber = 0;
const replies = new Map();
const format = value => number.format(value);
function label(value, className="note"){return node("div",value,className);}
function button(name,onClick,primary=false){
  const action=node("button",name,primary?"action":undefined);
  action.onclick=onClick;
  return action;
}
function listSelect(name, items, selected, onChange){
  const select=node("select");
  select.setAttribute("aria-label",name);
  for (const item of items){
    const option=node("option",item.name);
    option.value=item.id;
    option.selected=item.id===selected;
    select.append(option);
  }
  select.onchange=event=>onChange(event.target.value);
  return select;
}
function writeButton(name, onClick, primary=false, unavailable=false) {
  const element=button(name,onClick,primary);
  element.dataset.write=unavailable ? "unavailable" : "ready";
  element.disabled=busy || unavailable;
  return element;
}
function setBusy(value) {
  busy=value;
  document.querySelectorAll("[data-write]").forEach(element=>{
    element.disabled=value || element.dataset.write==="unavailable";
  });
}
async function request(path, body) {
  const response=await fetch(path,body===undefined ? {} : {
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
  });
  if(response.status===401) { location.reload(); throw Error("Sign in again to continue."); }
  const result=await response.json();
  if(!response.ok || (body!==undefined && !result?.ok)) throw Error(result?.error ?? "Action unavailable.");
  return result;
}
async function action(path, body, success, status=$("feedback")){
  if(busy) return;
  setBusy(true);
  status.textContent="Updating…";
  try {
    const result=await request(path,body);
    await refresh();
    $("feedback").textContent=success(result);
    return true;
  } catch(error){status.textContent=error.message;return false;}
  finally {setBusy(false);}
}
async function previewApproval(item) {
  const dialog=$("approval-dialog");
  approving=item;
  $("approval-title").textContent=item.title;
  $("approval-preview").textContent="";
  $("approval-status").textContent="Loading approval details…";
  $("submit-approval").disabled=true;
  dialog.showModal();
  try {
    const mail=await request("/api/decisions/"+item.id+"/preview");
    if(!dialog.open || approving!==item) return;
    const demo=state.sync.mode==="replay" || state.sync.mailMode==="dry-run";
    const note=demo && (mail.mode==="send" || mail.mode==="internal") ? "Approval records a simulated email in this workspace." : mail.note;
    $("approval-preview").textContent=[note,mail.to && "To: "+mail.to,mail.subject,mail.body].filter(Boolean).join("\n\n");
    $("approval-status").textContent="";
    $("submit-approval").disabled=false;
  } catch(error){if(dialog.open && approving===item) $("approval-status").textContent=error.message;}
}
function evidence(title,sources){
  $("source-title").textContent=title;
  const seen=new Set();
  $("source-list").replaceChildren();
  for(const citation of sources ?? []){
    const source=typeof citation==="string" ? {quote:citation} : citation;
    const file=source?.file || source?.source_file;
    if(!file && !source?.quote) continue;
    const key=JSON.stringify(source);
    if(seen.has(key)) continue;
    seen.add(key);
    const item=node("li");
    if(file){
      const link=node("a",file.split("/").pop());
      link.href="/api/source/"+file.split("/").map(encodeURIComponent).join("/")+(source.page?"#page="+source.page:"");
      link.target="_blank";
      link.rel="noopener";
      item.append(link, label([source.sheet,source.page ? "p. "+source.page : "",source.row ? "row "+source.row:""].filter(Boolean).join(" · ")));
    }
    if(source.quote) item.append(node("p",source.quote));
    $("source-list").append(item);
  }
  if(!seen.size) $("source-list").append(node("li","No source document is available for this item."));
  $("sources").showModal();
}
function summaries(){
  const cut=node("article",undefined,"metric");
  cut.append(label("Time to launch","label"),label("","number"),label(date.format(new Date(state.launch.deadline))+" CET · "+state.launch.location));
  cut.children[1].id="countdown";
  $("summary").replaceChildren(cut);
  for(const item of [...state.readiness].sort((a,b)=>Number(b.edition==="CE")-Number(a.edition==="CE"))){
    const metric=node("article",undefined,"metric");
    const expected=item.p50??item.packed, short=Math.max(0,item.target-expected), unit=item.missCostEur??item.stdCostEur;
    metric.classList.add(short?"short":"complete");
    metric.append(label(item.edition==="CE"?"Collector’s Edition":"Standard Edition","label"),label(format(short)+" short","number"));
    const bar=node("div",undefined,"bar");
    const fill=node("i");
    const coverage=item.target?Math.min(100,100*expected/item.target):100;
    fill.style.width=coverage+"%";
    bar.append(fill);
    metric.append(bar,label(format(item.probability*100)+"% modeled on time · "+format(item.p50)+" median packed","prob mono"));
    metric.append(label(format(expected)+" / "+format(item.target)+" expected · "+format(Math.round(coverage*10)/10)+"%"));
    metric.append(label(format(item.packed)+" already packed"+(unit==null?"":" · "+euro.format(short*unit)+(item.missCostEur==null?" at standard cost":item.missCostConfirmed===false?" potential loss (unconfirmed)":" at risk"))));
    if(item.firstStop) metric.append(label("First stoppage: "+item.firstStop));
    $("summary").append(metric);
  }
  updateClock();
}
function updateClock(){
  if(!state || !$("countdown")) return;
  const remaining=Math.max(0,Math.floor((new Date(state.launch.deadline)-Date.now())/1000));
  const pad=n=>String(n).padStart(2,"0");
  $("countdown").textContent=pad(Math.floor(remaining/3600))+":"+pad(Math.floor(remaining/60)%60)+":"+pad(remaining%60);
}
function drawRisk(){
  $("risks").replaceChildren();
  for(const risk of state.risks){
    const row=button("",()=>evidence(risk.component,risk.sources));
    row.className="risk";
    const subject=node("div");
    subject.append(node("h3",risk.component),label(risk.supplier,"muted"));
    if(risk.detail.length) subject.append(label(risk.detail[0],"risk-detail"));
    const gap=node("div");
    gap.append(node("b",risk.shortfall,"gap"),node("small",risk.gap ? "unit gap" : "watch"));
    row.append(subject,gap);
    $("risks").append(row);
  }
  if(!state.risks.length) $("risks").append(label("No current component risks."));
}
function drawOptions(){
  const item=state.options.find(o=>o.id===optionId) ?? state.options[0];
  $("options").replaceChildren();
  if(!item){$("options").append(label("No decisions pending."));return;}
  const blocked=item.status==="blocked" || item.approvalMode?.mode==="NEVER";
  const expired=item.status==="expired";
  const reviewed=item.status==="review" || item.review_requested;
  $("options").append(listSelect("Decision",state.options.map(o=>({id:o.id,name:o.title})),item.id,id=>{optionId=id;drawOptions();}));
  $("options").append(node("h3",item.title),node("p",item.recommendation),
    label(expired?"Expired":blocked?"Blocked":item.price===null?"Quote pending":euro.format(item.price),"price"),
    label(item.priceLabel ?? item.price_label ?? "Cost estimate"),label(item.impact),label(item.risk),label(item.threshold));
  const timing=item.supplier_timing;
  if(timing){
    $("options").append(label(`${timing.basis} · ${Math.round(timing.p_on_time*100)}% estimated arrival by final shift end · p50 ${date.format(new Date(timing.eta_p50))} · p90 ${date.format(new Date(timing.eta_p90))} CET · ${timing.sample_count} historical PO lines`));
  }
  const expedite=item.expedite, grid=expedite?.sensitivity[0];
  if(grid){
    const breakdown=node("details");
    const threshold=expedite.thresholds[0]?.break_even_loss_eur;
    breakdown.append(node("summary",`Expedite break-even · ${expedite.status}`),
      label(`${format(expedite.q_missing)} exposed copies · Materials estimate, freight and dock costs pending`),
      label(threshold==null?`No break-even at the modeled probability gain for ${expedite.readiness_scope}.`:
        `${euro.format(threshold)} per missing copy at the modeled probability gain for ${expedite.readiness_scope}.`));
    const table=node("table"), head=table.createTHead(), body=table.createTBody();
    head.insertRow().append(node("th","Assumed on-time gain"),...grid.probability_gains.map(gain=>node("th",`+${Math.round(gain*100)} pp`)));
    body.insertRow().append(node("th","Break-even per copy"),...grid.break_even_loss_eur.map(value=>node("td",value==null?"—":euro.format(value))));
    for(const row of grid.grid){
      body.insertRow().append(node("th",`Net at ${euro.format(row.loss_per_copy_eur)}/copy`),...row.net_benefit_eur.map(value=>node("td",euro.format(value))));
    }
    breakdown.append(table);
    $("options").append(breakdown);
  }
  const actions=node("div",undefined,"actions");
  const approved=item.status==="approved";
  const approve=writeButton(approved?"Approved":"Review and approve…",()=>previewApproval(item),true,approved);
  const review=writeButton(reviewed?"Review requested":"Request review",()=>action("/api/decisions/"+item.id+"/review",{},result=>
    result.status==="blocked" ? "Review requested. Release remains blocked." : result.effect?.lines?.join(" ") || "Review requested."),false,approved || reviewed || expired);
  if(!blocked && !expired) actions.append(approve);
  actions.append(review,button("Evidence",()=>evidence(item.title,item.evidence)));
  $("options").append(actions);
}
function drawThreads(){
  const previous=$("threads").querySelector("textarea");
  const editing=previous && document.activeElement===previous;
  const selection=editing && [previous.selectionStart, previous.selectionEnd];
  $("threads").replaceChildren();
  const thread=state.threads.find(t=>t.id===threadId) ?? state.threads[0];
  if(!thread){$("threads").append(label("No supplier follow-ups needed."));return;}
  $("threads").append(listSelect("Supplier thread",state.threads.map(t=>({id:t.id,name:t.supplier+" · "+t.material})),thread.id,id=>{threadId=id;drawThreads();}));
  $("threads").append(label(thread.status,"msg-status"));
  const messages=node("div",undefined,"messages");
  for(const message of thread.messages){
    const line=node("article");
    line.append(node("strong",message.sender),node("p",message.text));
    const fields=Object.entries(message.parsed || {}).filter(([key])=>key!=="reply_plan");
    if(fields.length) line.append(label(fields.map(([key,value])=>key+" "+value.value).join(" · ")));
    const replyPlan=message.parsed?.reply_plan;
    if(replyPlan){
      line.append(node("strong",replyPlan.simulated?"Simulated supplier reply · Review needed":"Supplier reply · Review needed"));
      for(const edition of replyPlan.editions || []){
        line.append(label(edition.title+" median packed · "+edition.before.toLocaleString()+" → "+edition.after.toLocaleString()));
        line.append(label("Upper forecast (p90) · "+edition.upperBefore.toLocaleString()+" → "+edition.upperAfter.toLocaleString()));
      }
      if(replyPlan.beforeState) line.append(label("Before · "+replyPlan.beforeState));
      if(replyPlan.afterState) line.append(label("After · "+replyPlan.afterState));
      line.append(node("p",replyPlan.nextAction));
    }
    messages.append(line);
  }
  $("threads").append(messages);
  if(thread.status==="draft"){
    const mode=state.sync.mode==="replay"?"dry-run":(state.sync.mailMode ?? "dry-run");
    $("threads").append(writeButton(mode==="dry-run"?"Approve dry-run send":"Approve supplier send",()=>{
      const prompt=mode==="dry-run" ? "Record a dry-run send of this draft?" : "Send this draft to "+thread.supplier+"?";
      if(window.confirm(prompt)) action("/api/threads/"+thread.id+"/send",{confirm:true},()=>mode==="dry-run" ? "Dry-run send recorded for "+thread.supplier+"." : "Message sent to "+thread.supplier+".");
    },true));
  }
  if(thread.status==="awaiting reply" && state.sync.mode==="replay"){
    const reply=node("textarea");
    reply.placeholder="Enter a simulated supplier reply";
    reply.setAttribute("aria-label","Simulated supplier reply");
    reply.value=replies.get(thread.id) || "";
    reply.oninput=()=>replies.set(thread.id,reply.value);
    $("threads").append(reply,writeButton("Import demo reply",async()=>{
      if(await action("/api/threads/"+thread.id+"/demo-reply",reply.value.trim()?{text:reply.value}:{},()=>"Simulated reply imported for "+thread.supplier+".")) replies.delete(thread.id);
    }));
    if(editing) { reply.focus({preventScroll:true}); reply.setSelectionRange(...selection); }
  }
}
function navigate(){
  const archive=location.hash==="#activity";
  $("dashboard-panels").hidden=archive;
  $("history-panels").hidden=!archive;
  $("page-name").textContent=archive?"Activity Log":"Dashboard";
  document.querySelectorAll(".rail nav a").forEach(a=>{
    if(a.hash===(archive?"#activity":"#dashboard"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
}
window.addEventListener("hashchange",navigate);
navigate();
function drawActivity(){
  const past=state.pastDecisions??[];
  $("past-decisions").replaceChildren(...past.map(d=>{
    const row=node("article",undefined,"activity");
    row.append(node("strong",d.title),label([d.status,d.effect?.by,d.decidedAt&&date.format(new Date(d.decidedAt))].filter(Boolean).join(" · ")));
    if(d.effect?.lines)row.append(label(d.effect.lines.join(" ")));
    return row;
  }));
  if(!past.length)$("past-decisions").append(label("No recorded decisions yet."));

  $("activity").replaceChildren(...state.activity.slice(0,8).map(item=>{
    const row=node("article",undefined,"activity");
    const detail=node("p",item.action);
    if(item.citation) detail.append(" ",button("Evidence",()=>evidence(item.action,[item.citation])));
    row.append(node("strong",item.agent),node("small",item.time),detail);
    return row;
  }));
}
async function refresh(){
  const call=++refreshNumber;
  try{
    const response=await fetch("/api/dashboard");
    if(response.status===401) { location.reload(); return; }
    const live=await response.json();
    if(call!==refreshNumber) return;
    $("account").hidden=!live.currentUser;
    $("username").textContent=live.currentUser ?? "";
    if(!response.ok) { lastState=undefined; $("sync-status").textContent=live.sync?.error ?? live.error; return; }
    const health=live.dataHealth;
    $("data-health").hidden=!health;
    if(health){
      const age=health.lastSyncAgeSeconds;
      const freshness=age==null?"Sync pending":age<60?"Synced <1 min ago":`Synced ${Math.floor(age/60)} min ago`;
      $("data-health").textContent=`Data health · ${health.filesSeen} seen · ${health.filesParsed} parsed · ${health.needsReview} need review · ${health.errors} errors · ${freshness}`;
    }
    const signature=JSON.stringify([live.launch,live.readiness,live.risks,live.options,live.threads,live.activity,live.pastDecisions,live.drop,live.sync?.pendingDrop,live.sync?.error,live.sync?.warnings,live.documentReviews]);
    if(signature===lastState) return;
    state=live;
    lastState=signature;
    $("launch").textContent=state.launch.name;
    $("site").textContent=state.launch.location+" · Hamburg";
    const drop=state.drop;
    const title=state.sync?.error ?? drop?.title ?? "Launch snapshot";
    const detail=state.sync?.error?"":drop?.detail;
    $("sync-status").replaceChildren(node("b",title),document.createTextNode(detail ?? ""));
    const reviews=[...(state.sync?.warnings ?? []),...(state.documentReviews ?? [])];
    $("source-reviews").hidden=!reviews.length;
    if(reviews.length){
      $("review-summary").textContent=`${reviews.length} sources need review · ${reviews[0].file.split("/").pop()}`;
      $("review-list").replaceChildren(...reviews.map(item=>node("li",`${item.file} · ${item.reason}`)));
    }
    $("sync").textContent=state.sync?.pendingDrop ? "Replay supplier drop" : "Refresh inputs";
    if(lastDrop && lastDrop!==drop?.id) $("feedback").textContent="Supplier inputs, gaps and decision options updated.";
    lastDrop=drop?.id;
    summaries();drawRisk();drawOptions();drawThreads();drawActivity();
  }catch(error){if(call!==refreshNumber) return; lastState=undefined; $("sync-status").textContent="Dashboard connection interrupted. Retrying…";}
}
$("sync").onclick=()=>action("/api/sync",{},()=>"Refresh queued.");
const approvalDialog=$("approval-dialog");
approvalDialog.addEventListener("close",()=>{approving=null;});
approvalDialog.addEventListener("cancel",event=>{if(busy) event.preventDefault();});
$("cancel-approval").onclick=()=>approvalDialog.close();
$("submit-approval").onclick=async()=>{
  if(!approving || busy) return;
  $("submit-approval").disabled=$("cancel-approval").disabled=true;
  const recorded=await action("/api/decisions/"+approving.id+"/approve",{},result=>
    result.effect?.lines?.join(" ") || "Approval recorded.",$("approval-status"));
  $("submit-approval").disabled=$("cancel-approval").disabled=false;
  if(recorded) approvalDialog.close();
};
$("close-sources").onclick=()=>$("sources").close();
async function pollDashboard(){
  await refresh();
  setTimeout(pollDashboard,3000);
}
pollDashboard();
setInterval(updateClock,1000);
</script></body></html>
