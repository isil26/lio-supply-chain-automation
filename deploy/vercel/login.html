<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Manti</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #141416; color: #f4f4f5; }
  body { display: grid; min-height: 100vh; place-items: center; margin: 0; }
  main { box-sizing: border-box; width: min(90vw, 420px); padding: 2rem; border: 1px solid #444449; border-radius: 16px; background: #222225; }
  .brand-label { display: block; width: 128px; height: auto; margin-bottom: 1.25rem; }
  p { color: #c3c3c7; margin-top: .25rem; }
  h1 { font-size: 1.75rem; line-height: 1.15; margin: .25rem 0 .6rem; }
  form { display: grid; gap: .65rem; margin-top: 1.5rem; }
  input, button { font: inherit; border-radius: 7px; padding: .65rem .75rem; }
  input { width: 100%; box-sizing: border-box; border: 1px solid #5b5b62; background: #141416; color: inherit; }
  button { border: 0; background: #d5d5d9; color: #212125; font-weight: 700; cursor: pointer; }
  :focus-visible { outline: 2px solid #92ddff; outline-offset: 3px; }
  [role="alert"] { margin: .75rem 0 0; color: #ffb5b5; }
</style>
</head>
<body>
<main>
  <img class="brand-label" src="/brand/manti-logo.png" width="128" height="22" alt="Manti">
  <h1>Soony Launch Control Room</h1>
  <p>Sign in to open the launch dashboard.</p>
  <!-- LOGIN_ERROR -->
  <form method="post" action="/login">
    <!-- LOGIN_RETURN -->
    <!-- NAMED_ACCOUNT_START -->
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required maxlength="80" autocapitalize="none" spellcheck="false">
    <!-- NAMED_ACCOUNT_END -->
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
    <button type="submit">Sign in</button>
  </form>
  <!-- SHARED_LOGIN_START -->
  <details><summary>Use the shared team login</summary>
    <p>Use your individual account to record supplier decisions.</p>
    <form method="post" action="/login">
      <!-- LOGIN_RETURN -->
      <label for="team-password">Team password</label>
      <input id="team-password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <button type="submit">Continue with team login</button>
    </form>
  </details>
  <!-- SHARED_LOGIN_END -->
</main>
</body>
</html>
