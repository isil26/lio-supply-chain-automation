<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15151c">
  <title>Launch overview · Lio Launch Desk</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="evidence.js"></script>
  <script defer src="art.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to dashboard</a>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Launch Desk overview"><span class="brand-icon" data-icon="brand"></span><span>Launch Desk</span></a>
    <div class="nav-group"><span class="overline nav-label">Workspace</span>
      <nav aria-label="Workspace">
        <a href="#overview" data-nav="overview"><i data-icon="grid"></i>Overview</a>
        <a href="#offers" data-nav="offers"><i data-icon="inbox"></i>Supplier offers</a>
        <a href="#decisions" data-nav="decisions"><i data-icon="list"></i>Decision queue<span class="nav-count" id="nav-count"></span></a>
        <a href="#activity" data-nav="activity"><i data-icon="history"></i>Activity log</a>
      </nav>
    </div>
    <div class="workspace-foot"><div class="workspace-avatar">GH</div><div><b>Grand Heist 6</b><small>Launch workspace</small></div></div>

  <div class="workspace">

    <main id="main" tabindex="-1">

      <div id="content"></div>
    </main>
  </div>
</div>
<dialog id="dialog"><div class="dialog-inner"><button class="close" aria-label="Close dialog" data-close><i data-icon="x"></i></button><div id="dialog-content"></div></div></dialog>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
